<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://kfgswynickhywzhneltu.supabase.co; media-src 'self' blob: https://kfgswynickhywzhneltu.supabase.co; connect-src 'self' https://kfgswynickhywzhneltu.supabase.co wss://kfgswynickhywzhneltu.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Teshrij</title>

  <script>
    // Clickjacking guard: GitHub Pages cannot send X-Frame-Options / frame-ancestors headers,
    // so refuse to run when the page is embedded in a frame on another site.
    window.__FRAMED__ = false;
    try {
      if (window.top !== window.self) {
        window.__FRAMED__ = true;
        document.documentElement.style.display = "none";
        try { window.top.location = window.self.location.href; } catch (e) {}
      }
    } catch (e) {
      window.__FRAMED__ = true;
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet">
  <style id="shell-css">
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; }
    .shell { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .shell img { height: 48px; }
    .shell p { margin: 0; color: #64748b; line-height: 1.6; }
    .shell a, .shell button { color: #2563eb; font: inherit; font-weight: 700; background: none; border: 0; cursor: pointer; text-decoration: none; }
    .shell .small { font-size: 0.8rem; opacity: 0.6; }
  </style>
</head>

<body>
  <div class="shell" id="shell">
    <img src="logo.svg" alt="Teshrij">
    <p id="shell-msg">Loading...</p>
  </div>

  <script>
    (function () {
      if (window.__FRAMED__) return;
      var FN = "https://kfgswynickhywzhneltu.supabase.co/functions/v1/view";
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id') || params.get('secret_uuid');
      var msg = document.getElementById('shell-msg');

      if (!id) { window.location.replace('/go/chatgpt.html'); return; }

      function say(text, retry) {
        msg.textContent = text;
        if (retry) {
          var b = document.createElement('button');
          b.textContent = 'Try again';
          b.onclick = function () { window.location.reload(); };
          msg.parentNode.appendChild(b);
        } else {
          var s = document.createElement('p');
          s.className = 'small';
          s.textContent = 'Support: 71 083 892 - 76 970 994';
          msg.parentNode.appendChild(s);
        }
      }

      fetch(FN + '?id=' + encodeURIComponent(id.trim()), { cache: 'no-store' })
        .then(function (r) {
          if (r.status === 404 || r.status === 400) { say('This link is not active. Message us on WhatsApp and we will send you a new one.'); return null; }
          if (!r.ok) { say('Could not load. Check your connection.', true); return null; }
          return r.text();
        })
        .then(function (code) {
          if (!code) return;
          var url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
          var el = document.createElement('script');
          el.src = url;
          el.onload = function () {
            URL.revokeObjectURL(url);
                  document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
          };
          el.onerror = function () { say('Could not load. Check your connection.', true); };
          document.body.appendChild(el);
        })
        .catch(function () { say('Could not load. Check your connection.', true); });
    })();
  </script>
</body>

</html>
